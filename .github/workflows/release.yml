# Publishes to PyPI when a GitHub release is published.
#
# A release marked "pre-release" is a rehearsal and goes to TestPyPI. Only a
# full release reaches PyPI, so a dry run cannot publish by accident.
#
# Uses PyPI trusted publishing (OpenID Connect): no API token is stored
# anywhere. One-time setup, on PyPI and on TestPyPI, under the project's
# "Publishing" page:
#   owner:        getmoriti
#   repository:   moriti
#   workflow:     release.yml
#   environment:  pypi            (testpypi on TestPyPI)
name: release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    needs: build
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

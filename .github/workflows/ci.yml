name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel and install it fresh (the stranger test)
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python -m pip install "$(ls dist/*.whl)[mcp,dev]"
      - name: Run the suite against the installed package
        # the console script, not `python -m pytest`: `-m` puts the checkout first on
        # sys.path and the suite would silently test the source instead of the wheel
        run: pytest -q -p no:cacheprovider
      - name: Run the quick-start example
        run: python -m examples.demo_policy_engine > /dev/null

  extras:
    name: test with every adapter extra (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, install with every adapter extra
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python -m pip install "$(ls dist/*.whl)[mcp,contextforge,adk,strands,agentframework,serve,dev]"
      - name: Run the full suite
        # the console script, not `python -m pytest`: `-m` puts the checkout first on
        # sys.path and the suite would silently test the source instead of the wheel
        run: pytest -q -p no:cacheprovider
      - name: Run the plugin walkthroughs
        run: |
          python -m examples.demo_contextforge > /dev/null
          python -m examples.demo_adk > /dev/null
          python -m examples.demo_strands > /dev/null
          python -m examples.demo_agentframework > /dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
